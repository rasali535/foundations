services:
  - type: web
    name: foundations-counselling-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    region: frankfurt
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: foundations_db
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://academyfoundations.com,https://www.academyfoundations.com
      - key: FCA_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: FCA_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: Foundations Counselling & Advisory <noreply@academyfoundations.com>
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v19.0
